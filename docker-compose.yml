services:
  composer-api:
    build:
      context: .
    image: composer-api:local
    container_name: composer-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      COMPOSER_API_HOST: 0.0.0.0
      COMPOSER_API_PORT: "8787"
    ports:
      - "${COMPOSER_API_HOST_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
